name: Verify workbook

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Check rule drift
        run: python _shared/check-rules.py
      - name: Verify public workbook
        run: python scripts/verify-template.py
      - name: Run fictional shadow workflow
        run: python scripts/smoke-test.py
      - name: Run operator preflight
        run: python scripts/preflight.py
